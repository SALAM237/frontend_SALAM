title = "SALAM frontend gitleaks config"

[extend]
useDefault = true

# Faux positif confirme le 22/08/2026 : `ASSOCIATION_STORAGE_KEY` est un nom
# de cle localStorage (identifiant de cache), pas un secret. La regle
# generic-api-key de gitleaks matche sur le nom de variable contenant "KEY"
# combine a une valeur qui ressemble a un identifiant. Allowlist ciblee sur
# la valeur exacte plutot qu'un allowlist large par fichier/regle, pour ne
# pas masquer un vrai secret qui apparaitrait plus tard dans le meme fichier.
[allowlist]
description = "Faux positifs confirmes"
regexes = [
  '''salam_invoice_association_v1''',
]
